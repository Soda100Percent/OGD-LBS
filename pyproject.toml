[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ogd-lbs"
version = "0.1.0"
description = "Code of Paper: Ordered Guided Decomposition: Example-Driven Mesh Simplification and Cross-Model Adaptation for LBS Characters"
authors = [
    {name = "Soda100Percent", email = "soda100percent@gmail.com"}
]
dependencies = [
    "numpy",
    "datasets==2.18.0",
    "huggingface_hub",
    "pandas"
]
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/Soda100Percent/OGD-LBS"

[tool.setuptools.packages.find]
where = ["src"]
